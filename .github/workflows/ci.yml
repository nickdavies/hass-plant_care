name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components/ tests/ tests_integration/
      - run: ruff format --check custom_components/ tests/ tests_integration/

  # The model imports no Home Assistant, so these need nothing but pytest and
  # probatio, which tests/conftest.py aliases as voluptuous the way Home
  # Assistant does. tests/test_no_ha_imports.py is what keeps that true: install
  # HA here and a stray import would stop being caught.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The probatio Home Assistant 2026.11.2 ships; move it with the pin below.
      - run: pip install pytest probatio==0.13.0
      - run: python -m pytest tests/ -v -c tests/pytest.ini

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # lovelace_codegen's main, not a pinned commit: what deploys is pinned
        # by hass-configs, so this is here to catch a library change that
        # breaks this component before that pin moves.
        with:
          repository: nickdavies/hass-lovelace_codegen
          path: .deps/hass-lovelace_codegen
      - uses: actions/checkout@v4
        # The same for the config bridge, which pins this component's
        # entities through its claims.
        with:
          repository: nickdavies/hass-config_bridge
          path: .deps/hass-config_bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Home Assistant's own test package, versioned with it: this installs
      # Home Assistant 2026.11.2, the version homelab deploys. Move it whenever
      # homelab's does.
      - run: pip install pytest pytest-homeassistant==2026.11.2 tzdata
      - run: python -m pytest tests_integration/ -v -c tests_integration/pytest.ini
